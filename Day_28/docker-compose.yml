# Part C.2 -- local container orchestration.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task28-llm-api:local
    ports:
      - "8000:7860"        # host:container -- container always listens on
                             # 7860 (matches the Dockerfile's cloud-deploy
                             # default), so this compose file doubles as a
                             # local rehearsal of the exact container that
                             # gets deployed.
    environment:
      - PORT=7860
      - PRELOAD_MODELS=true
      - LOG_LEVEL=INFO
      - HF_HOME=/app/.cache/huggingface
    env_file:
      - .env                # optional -- for HF_TOKEN etc.; see .env.example
    dns:
      - 8.8.8.8              # explicit resolvers -- some sandboxed/nested
      - 1.1.1.1               # Docker hosts don't propagate a working
                               # /etc/resolv.conf into the default bridge
                               # network's containers, breaking outbound
                               # HTTPS entirely (a real issue hit and fixed
                               # during this task's own development -- see
                               # README/Report's engineering-challenges
                               # section). Harmless to keep even on hosts
                               # where the default resolver already works.
    volumes:
      - hf-cache:/app/.cache/huggingface   # persists downloaded model weights
                                             # across `docker compose down/up`,
                                             # so cold-start is paid once per
                                             # host, not once per container run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 240s     # generous -- PRELOAD_MODELS=true means startup
                               # itself pays all three models' cold-start cost
                               # before the app is ready to serve traffic
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 1g
    restart: unless-stopped

volumes:
  hf-cache:
