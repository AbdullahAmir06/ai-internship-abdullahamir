# Part D -- local container orchestration.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: capstone-sentiment-api:local
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    dns:
      - 8.8.8.8   # explicit resolvers -- Task 28 hit a real DNS failure in
      - 1.1.1.1    # this same sandbox's default Docker bridge network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    restart: unless-stopped
