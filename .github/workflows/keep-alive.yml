name: Keep Day 29 service awake

# Render's free tier spins a web service down after ~15 minutes with no
# traffic, then pays a ~30-60s cold-start on the next request. This pings
# the live health endpoint every 10 minutes (comfortably inside that
# window, with margin for GitHub's scheduler not being minute-precise) so
# the service stays warm for demos/presentations without paying for a
# paid Render plan.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 30 \
            https://day29-phishing-inspector.onrender.com/healthz)
          echo "HTTP $status"
          cat /tmp/body.json
          echo
          if [ "$status" != "200" ]; then
            echo "::warning::Health check returned $status, not 200"
          fi
